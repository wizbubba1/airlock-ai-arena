name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit bundle smoke test
        run: npm run audit -- airlock-stage-zero-demo

      - name: Markdown report smoke test
        run: npm run report -- airlock-stage-zero-demo

      - name: Balance report smoke test
        run: npm run balance -- 100 stage-zero-ci

      - name: Build
        run: npm run build
