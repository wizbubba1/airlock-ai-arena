name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Artifact catalog smoke test
        run: npm run artifact-catalog

      - name: Audit bundle smoke test
        run: npm run audit -- airlock-stage-zero-demo

      - name: Challenge packet smoke test
        run: npm run challenge -- airlock-stage-zero-demo

      - name: Fallback drill smoke test
        run: npm run fallback-drill -- airlock-stage-zero-demo

      - name: Fallback drill verifier smoke test
        run: npm run verify-fallback-drill -- ./artifacts/airlock-fallback-drill-airlock-stage-zero-demo.json

      - name: Audit verifier smoke test
        run: npm run verify-audit -- ./artifacts/airlock-audit-airlock-stage-zero-demo.json

      - name: Markdown report smoke test
        run: npm run report -- airlock-stage-zero-demo

      - name: Transcript quality smoke test
        run: npm run transcript-quality -- airlock-stage-zero-demo

      - name: Transcript quality verifier smoke test
        run: npm run verify-transcript-quality -- ./artifacts/airlock-transcript-quality-airlock-stage-zero-demo.json

      - name: Reveal schedule smoke test
        run: npm run reveal-schedule -- airlock-stage-zero-demo

      - name: Reveal schedule verifier smoke test
        run: npm run verify-reveal-schedule -- ./artifacts/airlock-reveal-schedule-airlock-stage-zero-demo.json

      - name: Sanitizer audit smoke test
        run: npm run sanitizer-audit -- airlock-stage-zero-demo

      - name: Sanitizer audit verifier smoke test
        run: npm run verify-sanitizer-audit -- ./artifacts/airlock-sanitizer-audit-airlock-stage-zero-demo.json

      - name: Stage 0 evaluation smoke test
        run: npm run stage0-evaluation

      - name: Stage 0 evaluation verifier smoke test
        run: npm run verify-stage0-evaluation -- ./artifacts/airlock-stage0-evaluation.json

      - name: Pickem receipt smoke test
        run: npm run pickem -- airlock-stage-zero-demo vanta kepler

      - name: Pickem verifier smoke test
        run: npm run verify-pickem -- ./artifacts/airlock-pickem-airlock-stage-zero-demo.json

      - name: Agent manifest validation smoke test
        run: npm run validate-agent -- src/tests/fixtures/agents/vanta-author.json

      - name: Prompt commitment smoke test
        run: npm run commit-prompt -- src/tests/fixtures/agents/vanta-private-prompt.txt

      - name: Agent manifest generator smoke test
        run: npm run create-agent -- --prompt src/tests/fixtures/agents/vanta-private-prompt.txt --out ./artifacts/generated-agent.json

      - name: Agent submission packet smoke test
        run: npm run submit-agent -- src/tests/fixtures/agents/vanta-author.json stage1-preview.001

      - name: Agent submission verifier smoke test
        run: npm run verify-agent-submission -- ./artifacts/airlock-agent-submission.json

      - name: Balance report smoke test
        run: npm run balance:check

      - name: Balance verifier smoke test
        run: npm run verify-balance -- ./artifacts/airlock-balance-ci.json

      - name: Ladder preview smoke test
        run: npm run ladder -- 32 stage-one-ci

      - name: Ladder verifier smoke test
        run: npm run verify-ladder -- ./artifacts/airlock-ladder-32.json

      - name: Season manifest smoke test
        run: npm run season -- stage1-preview.001

      - name: Season manifest verifier smoke test
        run: npm run verify-season -- ./artifacts/airlock-season-stage1-preview.001.json

      - name: Seed index smoke test
        run: npm run seed-index

      - name: Seed index verifier smoke test
        run: npm run verify-seed-index -- ./artifacts/airlock-seed-index.json

      - name: Show pack smoke test
        run: npm run show-pack

      - name: Show pack verifier smoke test
        run: npm run verify-show-pack -- ./artifacts/airlock-show-pack.json

      - name: Full artifact verification smoke test
        run: npm run verify-all

      - name: Build
        run: npm run build
