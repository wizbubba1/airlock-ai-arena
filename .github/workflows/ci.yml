name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit bundle smoke test
        run: npm run audit -- airlock-stage-zero-demo

      - name: Challenge packet smoke test
        run: npm run challenge -- airlock-stage-zero-demo

      - name: Audit verifier smoke test
        run: npm run verify-audit -- ./artifacts/airlock-audit-airlock-stage-zero-demo.json

      - name: Markdown report smoke test
        run: npm run report -- airlock-stage-zero-demo

      - name: Agent manifest validation smoke test
        run: npm run validate-agent -- src/tests/fixtures/agents/vanta-author.json

      - name: Prompt commitment smoke test
        run: npm run commit-prompt -- src/tests/fixtures/agents/vanta-private-prompt.txt

      - name: Agent manifest generator smoke test
        run: npm run create-agent -- --prompt src/tests/fixtures/agents/vanta-private-prompt.txt --out ./artifacts/generated-agent.json

      - name: Balance report smoke test
        run: npm run balance:check

      - name: Ladder preview smoke test
        run: npm run ladder -- 32 stage-one-ci

      - name: Ladder verifier smoke test
        run: npm run verify-ladder -- ./artifacts/airlock-ladder-32.json

      - name: Season manifest smoke test
        run: npm run season -- stage1-preview.001

      - name: Build
        run: npm run build
